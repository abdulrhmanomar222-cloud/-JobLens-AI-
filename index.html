<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية ووردبريس التفاعلية | عبد الرحمن عمر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f2f5; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="glass sticky top-0 z-50 border-b border-gray-200 p-4 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600"><i class="fab fa-wordpress ml-2"></i>أكاديمية ووردبريس</h1>
            <div class="flex items-center gap-4">
                <span id="badge" class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm font-bold">🎓 مبتدئ</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Sidebar: Lessons List -->
            <div class="lg:col-span-1 space-y-4">
                <h2 class="text-xl font-bold mb-4 text-gray-700">قائمة الدروس</h2>
                <div id="lesson-list" class="space-y-2">
                    <!-- Lessons will be injected here -->
                </div>
            </div>

            <!-- Main Content: Lesson Player -->
            <div class="lg:col-span-2">
                <div id="active-lesson" class="glass rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                    <div class="p-6">
                        <div id="video-slot" class="video-container mb-6">
                            <!-- YouTube Embed -->
                        </div>
                        
                        <div class="flex justify-between items-center mb-4">
                            <h2 id="lesson-title" class="text-2xl font-bold text-gray-800">جاري التحميل...</h2>
                            <button onclick="readAloud()" class="bg-blue-100 text-blue-600 p-2 rounded-full hover:bg-blue-200 transition">
                                <i class="fas fa-volume-up"></i> استمع للشرح
                            </button>
                        </div>

                        <p id="lesson-desc" class="text-gray-600 mb-6 leading-relaxed"></p>

                        <div id="lesson-sections" class="space-y-4 border-t pt-6">
                            <!-- Sections -->
                        </div>

                        <!-- Interactive Challenge -->
                        <div class="mt-8 bg-blue-50 p-6 rounded-xl border-2 border-dashed border-blue-200">
                            <h3 class="font-bold text-blue-800 mb-2"><i class="fas fa-tasks ml-2"></i>التحدي العملي:</h3>
                            <p id="challenge-text" class="text-blue-700 mb-4"></p>
                            <button onclick="completeChallenge()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">لقد نفذت المهمة بنجاح!</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const lessons = [
            {
                id: "1",
                title: "ما هو ووردبريس؟",
                desc: "تعرف على أقوى نظام لإدارة المواقع في العالم وكيف بدأ.",
                videoId: "rkmGNyRbQRo",
                narration: "ووردبريس هو نظام مفتوح المصدر يتيح لك بناء موقعك دون كتابة كود واحد.",
                challenge: "اذهب إلى لوحة التحكم واستكشف القائمة الجانبية."
            },
            {
                id: "2",
                title: "إضافة مقالك الأول",
                desc: "تعلم كيف تستخدم محرر المربعات لنشر أفكارك.",
                videoId: "D9IE9KKainI",
                narration: "لإضافة مقال، نتوجه إلى قسم التدوينات ثم نضغط على أضف جديداً.",
                challenge: "اكتب عنواناً لمقالك الأول واضغط على زر النشر."
            },
            {
                id: "3",
                title: "تخصيص القوالب",
                desc: "غير مظهر موقعك بضغطة زر واحدة عبر القوالب الجاهزة.",
                videoId: "uMdiA_p84tI",
                narration: "القوالب هي التي تحدد شكل الموقع، الألوان، والخطوط.",
                challenge: "قم بتفعيل قالب جديد وشاهد كيف تغير شكل الموقع."
            }
        ];

        let currentLessonIndex = 0;

        function loadLesson(index) {
            currentLessonIndex = index;
            const lesson = lessons[index];
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('lesson-desc').innerText = lesson.desc;
            document.getElementById('challenge-text').innerText = lesson.challenge;
            document.getElementById('video-slot').innerHTML = `<iframe src="https://www.youtube.com/embed/${lesson.videoId}" frameborder="0" allowfullscreen></iframe>`;
            
            updateSidebar();
        }

        function updateSidebar() {
            const list = document.getElementById('lesson-list');
            list.innerHTML = lessons.map((l, i) => `
                <div onclick="loadLesson(${i})" class="p-4 rounded-xl cursor-pointer transition ${i === currentLessonIndex ? 'bg-blue-600 text-white shadow-lg' : 'bg-white hover:bg-gray-100'}">
                    <h3 class="font-bold">${i+1}. ${l.title}</h3>
                </div>
            `).join('');
        }

        function readAloud() {
            const text = lessons[currentLessonIndex].narration;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        function completeChallenge() {
            alert("أحسنت يا بطل! لقد اجتزت التحدي بنجاح. استمر في التعلم.");
            if (currentLessonIndex < lessons.length - 1) {
                loadLesson(currentLessonIndex + 1);
            } else {
                document.getElementById('badge').innerText = "🏆 خبير ووردبريس";
                alert("تهانينا! لقد أنهيت الدورة كاملة وأصبحت خبيراً!");
            }
        }

        // Initial Load
        loadLesson(0);
    </script>
</body>
</html>
